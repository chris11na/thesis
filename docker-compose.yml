services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thesis-backend
    ports:
      - "8000:8000"
    volumes:
      # Named volume: bind-mount to ./backend/app.db fails on fresh clones when the
      # host path is missing (Docker may create a directory named app.db).
      - thesis_backend_data:/app/db
    env_file:
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: sqlite:////app/db/app.db
      # OAuth redirect after sign-in; override local .env (often :5500 for Playwright).
      FRONTEND_URL: http://127.0.0.1:8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thesis-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  thesis_backend_data:

