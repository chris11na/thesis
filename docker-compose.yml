version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thesis-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app.db:/app/app.db
    env_file:
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
      # OAuth redirect after sign-in; override local .env (often :5500 for Playwright).
      FRONTEND_URL: http://127.0.0.1:8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thesis-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

