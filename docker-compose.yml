version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thesis-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app.db:/app/app.db
    environment:
      # Add environment variables here if needed later
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thesis-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

