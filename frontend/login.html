<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Вход и регистрация</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      body {
        background: #f5f7fa;
        color: #222;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
        max-width: 400px;
        width: 100%;
        padding: 28px;
        border: 1px solid #e5e7eb;
      }
      .card-header-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 6px;
      }
      .card-header-row h1 {
        margin: 0;
        flex: 1;
        min-width: 0;
        font-size: 20px;
        font-weight: 600;
        color: #111827;
        line-height: 1.25;
      }
      .lang-toggle-btn {
        flex-shrink: 0;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid #d1d5db;
        background: #f9fafb;
        color: #374151;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .subtitle {
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 16px;
      }
      .tab-row {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
      }
      .tab-btn {
        flex: 1;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        font-size: 13px;
        font-weight: 500;
        color: #4b5563;
        cursor: pointer;
      }
      .tab-btn:hover {
        background: #f3f4f6;
      }
      .tab-btn.active {
        background: #eff6ff;
        border-color: #93c5fd;
        color: #1d4ed8;
        font-weight: 600;
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }
      .field-label {
        font-size: 12px;
        font-weight: 500;
        color: #4b5563;
        margin-bottom: 4px;
      }
      input[type="email"],
      input[type="password"],
      input[type="text"] {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        font-size: 14px;
        margin-bottom: 14px;
      }
      input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25);
      }
      .primary-btn {
        width: 100%;
        padding: 10px 14px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: #ffffff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        margin-top: 4px;
      }
      .primary-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .status-area {
        margin-top: 0;
        min-height: 0;
        font-size: 13px;
      }
      .status-area.has-message {
        margin-top: 14px;
      }
      .status-text {
        padding: 8px 10px;
        border-radius: 8px;
      }
      .status-text.info {
        background: #eff6ff;
        color: #1d4ed8;
        border: 1px solid #dbeafe;
      }
      .status-text.success {
        background: #ecfdf3;
        color: #15803d;
        border: 1px solid #bbf7d0;
      }
      .status-text.error {
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
      }
      .hint {
        margin-top: 16px;
        font-size: 11px;
        color: #9ca3af;
        line-height: 1.45;
      }
      code {
        font-size: 11px;
        background: #f3f4f6;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .oauth-divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 12px 0 12px;
        font-size: 12px;
        color: #9ca3af;
      }
      .oauth-divider::before,
      .oauth-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e5e7eb;
      }
      .oauth-row {
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      .oauth-btn {
        display: block;
        width: 100%;
        text-align: center;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid #d1d5db;
        background: #ffffff;
        color: #374151;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
      }
      .oauth-btn:hover {
        background: #f9fafb;
        border-color: #9ca3af;
      }

      .oauth-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 8px 0;
        color: #6b7280;
        font-size: 13px;
      }

      .oauth-spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid #e5e7eb;
        border-top-color: #2563eb;
        animation: oauth-spin 0.72s linear infinite;
        flex-shrink: 0;
      }

      @keyframes oauth-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-header-row">
        <h1 id="login-title">Вход и регистрация</h1>
        <button type="button" class="lang-toggle-btn" id="lang-toggle-btn">RU</button>
      </div>
      <p class="subtitle" id="login-subtitle">
        Конфигуратор откроется после успешного входа или регистрации.
      </p>

      <div class="tab-row">
        <button type="button" class="tab-btn active" id="tab-login-btn">
          Вход
        </button>
        <button type="button" class="tab-btn" id="tab-register-btn">
          Регистрация
        </button>
      </div>

      <div id="panel-login" class="panel active">
        <div class="field-label" id="login-email-label">Email</div>
        <input
          type="email"
          id="login-email-input"
          placeholder=""
          autocomplete="username"
        />

        <div class="field-label" id="login-password-label">Пароль</div>
        <input
          type="password"
          id="login-password-input"
          placeholder=""
          autocomplete="current-password"
        />

        <button class="primary-btn" id="login-btn" type="button">Войти</button>

        <div class="oauth-divider" id="oauth-divider">или</div>
        <div class="oauth-row" id="oauth-row" aria-label="Вход через провайдера"></div>
      </div>

      <div id="panel-register" class="panel">
        <div class="field-label" id="register-name-label">Имя</div>
        <input
          type="text"
          id="register-name-input"
          placeholder=""
          autocomplete="name"
        />

        <div class="field-label" id="register-email-label">Корпоративный email</div>
        <input
          type="email"
          id="register-email-input"
          placeholder=""
          autocomplete="email"
        />

        <div class="field-label" id="register-password-label">Пароль (не короче 6 символов)</div>
        <input
          type="password"
          id="register-password-input"
          placeholder=""
          autocomplete="new-password"
        />

        <button class="primary-btn" id="register-btn" type="button">
          Зарегистрироваться
        </button>
      </div>

      <div class="status-area" id="auth-status-area"></div>

      <p class="hint" id="login-hint"></p>
    </div>

    <script>
      const API_BASE = "https://thesis-zqvx.onrender.com";
      const TOKEN_STORAGE_KEY = "access_token";
      const REFRESH_TOKEN_STORAGE_KEY = "refresh_token";
      const UI_LANG_STORAGE_KEY = "ui_lang";

      const tabLoginBtn = document.getElementById("tab-login-btn");
      const tabRegisterBtn = document.getElementById("tab-register-btn");
      const panelLogin = document.getElementById("panel-login");
      const panelRegister = document.getElementById("panel-register");

      const loginEmailInput = document.getElementById("login-email-input");
      const loginPasswordInput = document.getElementById("login-password-input");
      const loginBtn = document.getElementById("login-btn");

      const registerNameInput = document.getElementById("register-name-input");
      const registerEmailInput = document.getElementById("register-email-input");
      const registerPasswordInput = document.getElementById(
        "register-password-input"
      );
      const registerBtn = document.getElementById("register-btn");

      const authStatusArea = document.getElementById("auth-status-area");
      const langToggleBtn = document.getElementById("lang-toggle-btn");
      let currentLang = localStorage.getItem(UI_LANG_STORAGE_KEY) || "ru";

      const i18n = {
        ru: {
          title: "Вход и регистрация",
          subtitle: "Конфигуратор откроется после успешного входа или регистрации.",
          tabLogin: "Вход",
          tabRegister: "Регистрация",
          email: "Email",
          password: "Пароль",
          loginBtn: "Войти",
          or: "или",
          name: "Имя",
          corpEmail: "Корпоративный email",
          registerPass: "Пароль (не короче 6 символов)",
          registerBtn: "Зарегистрироваться",
          langBtn: "RU",
          loginEmailPh: "you@example.com",
          loginPasswordPh: "Введите пароль",
          regNamePh: "Как к вам обращаться",
          regEmailPh: "you@yourcompany.com",
          regPasswordPh: "Не менее 6 символов",
          registerProgress: "Создаём аккаунт…",
          loginProgress: "Входим…",
          oauthChecking: "Проверяем способы входа…",
          signInGoogle: "Войти через Google",
          signInMicrosoft: "Войти через Microsoft",
        },
        en: {
          title: "Sign in or sign up",
          subtitle: "The configurator opens after you sign in or create an account.",
          tabLogin: "Sign in",
          tabRegister: "Sign up",
          email: "Email",
          password: "Password",
          loginBtn: "Sign in",
          or: "or",
          name: "Name",
          corpEmail: "Corporate email",
          registerPass: "Password (at least 6 characters)",
          registerBtn: "Create account",
          langBtn: "EN",
          loginEmailPh: "you@example.com",
          loginPasswordPh: "Your password",
          regNamePh: "How should we address you",
          regEmailPh: "you@yourcompany.com",
          regPasswordPh: "At least 6 characters",
          registerProgress: "Creating your account…",
          loginProgress: "Signing in…",
          oauthChecking: "Checking sign-in options…",
          signInGoogle: "Sign in with Google",
          signInMicrosoft: "Sign in with Microsoft",
        },
      };

      function refreshOAuthButtonLabels() {
        const row = document.getElementById("oauth-row");
        if (!row) return;
        const t = i18n[currentLang];
        row.querySelectorAll('a.oauth-btn[data-oauth-provider="google"]').forEach((a) => {
          a.textContent = t.signInGoogle;
        });
        row.querySelectorAll('a.oauth-btn[data-oauth-provider="microsoft"]').forEach((a) => {
          a.textContent = t.signInMicrosoft;
        });
      }

      function applyLanguage(lang) {
        currentLang = lang === "en" ? "en" : "ru";
        localStorage.setItem(UI_LANG_STORAGE_KEY, currentLang);
        document.documentElement.lang = currentLang;
        const t = i18n[currentLang];
        document.getElementById("login-title").textContent = t.title;
        document.getElementById("login-subtitle").textContent = t.subtitle;
        tabLoginBtn.textContent = t.tabLogin;
        tabRegisterBtn.textContent = t.tabRegister;
        document.getElementById("login-email-label").textContent = t.email;
        document.getElementById("login-password-label").textContent = t.password;
        loginBtn.textContent = t.loginBtn;
        const oauthDiv = document.getElementById("oauth-divider");
        if (oauthDiv) oauthDiv.textContent = t.or;
        document.getElementById("register-name-label").textContent = t.name;
        document.getElementById("register-email-label").textContent = t.corpEmail;
        document.getElementById("register-password-label").textContent = t.registerPass;
        registerBtn.textContent = t.registerBtn;
        if (langToggleBtn) langToggleBtn.textContent = t.langBtn;
        if (loginEmailInput) loginEmailInput.placeholder = t.loginEmailPh;
        if (loginPasswordInput) loginPasswordInput.placeholder = t.loginPasswordPh;
        if (registerNameInput) registerNameInput.placeholder = t.regNamePh;
        if (registerEmailInput) registerEmailInput.placeholder = t.regEmailPh;
        if (registerPasswordInput) registerPasswordInput.placeholder = t.regPasswordPh;
        const loginHint = document.getElementById("login-hint");
        if (loginHint) {
          loginHint.innerHTML =
            currentLang === "en"
              ? [
                  "<strong>Demo sign-in:</strong>",
                  "<br />",
                  "Admin",
                  "<br />",
                  "Email: <code>admin@example.com</code>",
                  "<br />",
                  "Password: <code>admin123</code>",
                  "<br /><br />",
                  "User",
                  "<br />",
                  "Email: <code>user@example.com</code>",
                  "<br />",
                  "Password: <code>user123</code>",
                ].join("")
              : [
                  "<strong>Демо-вход:</strong>",
                  "<br />",
                  "Администратор",
                  "<br />",
                  "Почта: <code>admin@example.com</code>",
                  "<br />",
                  "Пароль: <code>admin123</code>",
                  "<br /><br />",
                  "Пользователь",
                  "<br />",
                  "Почта: <code>user@example.com</code>",
                  "<br />",
                  "Пароль: <code>user123</code>",
                ].join("");
        }
        refreshOAuthButtonLabels();
      }

      function setAuthStatus(message, type = "info") {
        if (!authStatusArea) return;
        authStatusArea.innerHTML = "";
        authStatusArea.classList.toggle("has-message", !!message);
        if (!message) return;
        const div = document.createElement("div");
        div.className = "status-text " + type;
        div.textContent = message;
        authStatusArea.appendChild(div);
      }

      function formatApiDetail(detail) {
        if (detail == null) return "Ошибка";
        if (typeof detail === "string") return detail;
        if (Array.isArray(detail)) {
          return detail
            .map((e) =>
              e && typeof e === "object" && e.msg ? e.msg : JSON.stringify(e)
            )
            .join(" ");
        }
        return String(detail);
      }

      function showPanel(which) {
        const isLogin = which === "login";
        panelLogin.classList.toggle("active", isLogin);
        panelRegister.classList.toggle("active", !isLogin);
        tabLoginBtn.classList.toggle("active", isLogin);
        tabRegisterBtn.classList.toggle("active", !isLogin);
        setAuthStatus("", "info");
      }

      tabLoginBtn.addEventListener("click", () => showPanel("login"));
      tabRegisterBtn.addEventListener("click", () => showPanel("register"));

      function storeTokensAndGo(json) {
        const at = json && json.access_token ? json.access_token : null;
        const rt = json && json.refresh_token ? json.refresh_token : null;
        if (!at || !rt) {
          setAuthStatus("Сервер не вернул пару токенов.", "error");
          return false;
        }
        localStorage.setItem(TOKEN_STORAGE_KEY, at);
        localStorage.setItem(REFRESH_TOKEN_STORAGE_KEY, rt);
        setAuthStatus("Успешно. Переход…", "success");
        window.location.href = "index.html";
        return true;
      }

      async function tryRefresh() {
        const refreshToken = localStorage.getItem(REFRESH_TOKEN_STORAGE_KEY);
        if (!refreshToken) return false;
        try {
          const response = await fetch(API_BASE + "/auth/refresh", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ refresh_token: refreshToken }),
          });
          const json = await response.json().catch(() => null);
          if (!response.ok || !json || !json.access_token || !json.refresh_token) {
            localStorage.removeItem(TOKEN_STORAGE_KEY);
            localStorage.removeItem(REFRESH_TOKEN_STORAGE_KEY);
            return false;
          }
          localStorage.setItem(TOKEN_STORAGE_KEY, json.access_token);
          localStorage.setItem(REFRESH_TOKEN_STORAGE_KEY, json.refresh_token);
          return true;
        } catch {
          localStorage.removeItem(TOKEN_STORAGE_KEY);
          localStorage.removeItem(REFRESH_TOKEN_STORAGE_KEY);
          return false;
        }
      }

      function readOAuthErrorFromUrl() {
        const p = new URLSearchParams(window.location.search);
        if (p.get("oauth_error") !== "1") return;
        const raw = p.get("detail") || "Ошибка входа через провайдера.";
        let msg = raw;
        try {
          msg = decodeURIComponent(raw);
        } catch (_) {}
        setAuthStatus(msg, "error");
        const u = new URL(window.location.href);
        u.searchParams.delete("oauth_error");
        u.searchParams.delete("detail");
        const tail = u.search ? u.search : "";
        window.history.replaceState({}, "", u.pathname + tail);
      }

      async function loadOAuthButtons() {
        const row = document.getElementById("oauth-row");
        if (!row) return;
        const divider = document.querySelector("#panel-login .oauth-divider");
        row.innerHTML = "";
        row.style.display = "flex";
        const loadingWrap = document.createElement("div");
        loadingWrap.className = "oauth-loading";
        const spin = document.createElement("div");
        spin.className = "oauth-spinner";
        spin.setAttribute("aria-hidden", "true");
        const loadingLabel = document.createElement("span");
        loadingLabel.textContent = i18n[currentLang].oauthChecking;
        loadingWrap.appendChild(spin);
        loadingWrap.appendChild(loadingLabel);
        row.appendChild(loadingWrap);
        try {
          const r = await fetch(API_BASE + "/auth/oauth/providers");
          const j = await r.json().catch(() => ({}));
          row.innerHTML = "";
          if (!j.google && !j.microsoft) {
            row.remove();
            if (divider) divider.remove();
            return;
          }
          if (j.google) {
            const a = document.createElement("a");
            a.className = "oauth-btn";
            a.href = API_BASE + "/auth/google/login";
            a.dataset.oauthProvider = "google";
            a.textContent = i18n[currentLang].signInGoogle;
            row.appendChild(a);
          }
          if (j.microsoft) {
            const a = document.createElement("a");
            a.className = "oauth-btn";
            a.href = API_BASE + "/auth/microsoft/login";
            a.dataset.oauthProvider = "microsoft";
            a.textContent = i18n[currentLang].signInMicrosoft;
            row.appendChild(a);
          }
        } catch (_) {
          row.remove();
          if (divider) divider.remove();
        }
      }

      async function boot() {
        readOAuthErrorFromUrl();
        const accessToken = localStorage.getItem(TOKEN_STORAGE_KEY);
        if (accessToken) {
          window.location.href = "index.html";
          return;
        }
        if (await tryRefresh()) {
          window.location.href = "index.html";
          return;
        }
        await loadOAuthButtons();
      }

      loginBtn.addEventListener("click", async () => {
        const email = (loginEmailInput.value || "").trim().toLowerCase();
        const password = loginPasswordInput.value || "";
        if (!email) {
          setAuthStatus("Введите email.", "error");
          return;
        }
        loginBtn.disabled = true;
        setAuthStatus(i18n[currentLang].loginProgress, "info");
        try {
          const response = await fetch(API_BASE + "/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const json = await response.json().catch(() => null);
          if (!response.ok) {
            setAuthStatus(
              formatApiDetail(json && json.detail) || "Ошибка входа",
              "error"
            );
            return;
          }
          storeTokensAndGo(json);
        } catch (e) {
          console.error(e);
          setAuthStatus("Сеть: не удалось связаться с backend.", "error");
        } finally {
          loginBtn.disabled = false;
        }
      });

      registerBtn.addEventListener("click", async () => {
        const name = (registerNameInput.value || "").trim();
        const email = (registerEmailInput.value || "").trim().toLowerCase();
        const password = registerPasswordInput.value || "";
        if (!name) {
          setAuthStatus("Укажите имя.", "error");
          return;
        }
        if (!email) {
          setAuthStatus("Укажите email.", "error");
          return;
        }
        if (password.length < 6) {
          setAuthStatus("Пароль не короче 6 символов.", "error");
          return;
        }
        registerBtn.disabled = true;
        setAuthStatus(i18n[currentLang].registerProgress, "info");
        try {
          const response = await fetch(API_BASE + "/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, password }),
          });
          const json = await response.json().catch(() => null);
          if (!response.ok) {
            setAuthStatus(
              formatApiDetail(json && json.detail) || "Ошибка регистрации",
              "error"
            );
            return;
          }
          storeTokensAndGo(json);
        } catch (e) {
          console.error(e);
          setAuthStatus("Сеть: не удалось связаться с backend.", "error");
        } finally {
          registerBtn.disabled = false;
        }
      });

      applyLanguage(currentLang);
      boot();
      if (langToggleBtn) {
        langToggleBtn.addEventListener("click", () => {
          applyLanguage(currentLang === "ru" ? "en" : "ru");
        });
      }
    </script>
  </body>
</html>
